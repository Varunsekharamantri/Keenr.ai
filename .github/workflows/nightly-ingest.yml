name: Daily refresh

# Every morning at 8:00 IST: collect the day's news and filings, rescore, and
# rewrite the insights - into the shared Neon database, whether or not the
# laptop or the dashboard is running. Set SCHEDULE_ENABLED=false in the local .env once this is
# live, otherwise the app's in-process APScheduler will ingest a second time.

on:
  schedule:
    # 02:30 UTC daily. GitHub queues scheduled runs under load, so treat the
    # time as approximate rather than exact.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's refresh already succeeded"
        type: boolean
        default: false
      limit_per_company:
        description: "Documents per source per company"
        default: "3"

concurrency:
  # Never let a slow run overlap the next night's — they'd double-spend the
  # Exa budget and race on the same rows.
  group: nightly-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # Until the Neon database and API keys are added as repository Secrets,
      # skip cleanly instead of failing (and emailing) every morning.
      - name: Check configuration
        id: config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: repository secrets are not set yet. Add DATABASE_URL, EXA_API_KEY, GROQ_API_KEY and SEC_USER_AGENT under Settings > Secrets and variables > Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'

      - uses: actions/setup-python@v5
        if: steps.config.outputs.configured == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: pip install -r backend/requirements.txt

      - name: Run ingest
        if: steps.config.outputs.configured == 'true'
        working-directory: backend
        env:
          # Supplied as repository Secrets — never hardcode these.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # The runner's disk is discarded, and local_path is never read back,
          # so writing the raw text archive would be pure waste.
          RAW_STORE_ENABLED: "false"
          # This process IS the schedule; the in-process one must stay off.
          SCHEDULE_ENABLED: "false"
          SCHEDULE_SECTOR_FILTER: BFSI
        # The same job as the app's own 8 AM refresh (app/daily_job.py):
        # source-aware ingestion, rescoring, People to Tap refresh, and writing
        # the AI summaries for every page - all into the shared database, so
        # the dashboard shows the new data and insights without redeploying.
        run: |
          python run_ingest.py \
            --limit-per-company "${{ inputs.limit_per_company || '3' }}" \
            ${{ inputs.force && '--force' || '' }}
